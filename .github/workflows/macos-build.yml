name: macOS build check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Show active Xcode
        run: xcodebuild -version
      - name: Install project generator
        run: brew install xcodegen
      - name: Check core and both apps
        run: bash scripts/check_mac.sh
